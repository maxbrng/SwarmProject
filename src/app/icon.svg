<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>What We Cannot Destroy</title>
  <!-- The mark is one creature and the trail it leaves, which is exactly what the renderer draws:
       every boid is a triangle pointing the way it travels, smeared into a fading streak by the
       trail pass. The streak runs through two of the species colours and the creature carries the
       third. No background plate, so the icon sits on light and dark browser chrome alike. -->
  <defs>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#79e06a" stop-opacity="0"/>
      <stop offset=".28" stop-color="#79e06a" stop-opacity=".75"/>
      <stop offset=".62" stop-color="#79e06a"/>
      <stop offset="1" stop-color="#5b9cf8"/>
    </linearGradient>
  </defs>
  <path d="M12 88 C 24 62, 38 44, 60 33" fill="none" stroke="url(#trail)" stroke-width="16" stroke-linecap="round"/>
  <polygon points="27,0 -16,17 -16,-17" transform="translate(64,30) rotate(-24)" fill="#f0674f"/>
</svg>
